<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>popAI · Sketch 4:3 (protótipo)</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#101211;color:#e7e7e7}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #99b5f6;outline-offset:3px}
[hidden]{display:none!important}
.window{--w:min(640px,calc(100vw - 124px),calc((100dvh - 188px)*4/3));position:relative;
 width:calc(var(--w) + 88px);max-width:calc(100vw - 18px);padding:60px 0 65px;
 border:1px solid #ffffff0c;border-radius:24px;background:#222824;box-shadow:0 28px 90px #0008}
.board{width:var(--w);aspect-ratio:4/3;margin:0 auto;background:#202121;border:1px solid #ffffff0b;
 border-radius:5px;position:relative;overflow:hidden}
.selection-box{position:absolute;z-index:1;border:1.5px dashed #9dbaff;background:#92b6ff0b;pointer-events:none;border-radius:3px;box-shadow:0 0 0 1px #10111266}
.resize-handle{position:absolute;width:14px;height:14px;padding:0;border:2px solid #253347;border-radius:4px;background:#c7dcff;pointer-events:auto;touch-action:none;box-shadow:0 0 0 1px #b9d2ff60}
.resize-handle[data-corner="nw"]{top:-7px;left:-7px;cursor:nwse-resize}
.resize-handle[data-corner="ne"]{top:-7px;right:-7px;cursor:nesw-resize}
.resize-handle[data-corner="sw"]{bottom:-7px;left:-7px;cursor:nesw-resize}
.resize-handle[data-corner="se"]{bottom:-7px;right:-7px;cursor:nwse-resize}
.resize-handle:focus-visible{outline:2px solid #fff;outline-offset:3px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.left,.right{position:absolute;z-index:2;top:13px;display:flex;gap:5px}.left{left:14px}.right{right:14px}
.icon{width:33px;height:33px;border:0;border-radius:11px;background:transparent;color:#949595;padding:7px}
.icon svg,.tool svg,.accept svg{display:block;width:100%;height:100%}
.icon:hover:enabled{background:#ffffff0c;color:#f4f4f4}.icon:disabled{opacity:.25;cursor:default}
.toolbar{position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:2;
 display:flex;gap:1px;padding:4px;border-radius:28px;background:#373838;box-shadow:0 4px 15px #0003}
.tool{width:39px;height:39px;padding:9px;display:grid;place-items:center;color:#adb0ae;
 border:0;border-radius:50%;background:transparent}
.tool:hover{background:#ffffff0d;color:white}.tool[aria-pressed=true]{background:#505251;color:white}
.tool svg{stroke-width:1.85}
.shape-menu{position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:3;
 display:flex;gap:5px;padding:5px;border:1px solid #ffffff20;border-radius:12px;background:#373938;
 box-shadow:0 7px 20px #0008}
.shape-menu button{width:34px;height:34px;border:0;border-radius:7px;background:transparent;color:#ccc;padding:8px}
.shape-menu button:hover,.shape-menu button[aria-pressed=true]{background:#565957}
.shape-menu svg{display:block;width:100%;height:100%}
.slider{position:absolute;top:50%;left:16px;transform:translateY(-50%);height:174px;width:25px}
.slider input{position:absolute;top:50%;left:50%;translate:-50% -50%;appearance:none;-webkit-appearance:none;
 width:156px;height:4px;transform:rotate(-90deg);background:#535656;border-radius:4px;cursor:pointer}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
 background:#fff;border:1px solid #f4f4f4;border-radius:50%;box-shadow:0 0 0 1px #111}
.slider input::-moz-range-thumb{width:19px;height:19px;background:white;border:0;border-radius:50%}
.palette{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);max-width:calc(100% - 104px);
 display:flex;align-items:center;gap:7px;padding:5px 4px;overflow-x:auto;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.swatch{--c:white;width:25px;height:25px;flex:0 0 25px;border-radius:50%;
 border:1px solid #ffffff25;background:var(--c);padding:0;position:relative}
.swatch:hover{transform:translateY(-1px)}
.swatch[aria-pressed=true]::after{content:"";position:absolute;inset:-4px;border:2px solid #e9e9e9;border-radius:50%}
.wheel{border:0;background:conic-gradient(#ed203d,#fd9923,#e8e728,#18b956,#0ab8d6,#4c5adf,#d62cac,#ed203d)}
.wheel:before{content:"";position:absolute;inset:8px;border-radius:50%;background:#c4c4c4}
#custom{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.accept{position:absolute;bottom:13px;right:14px;width:38px;height:38px;padding:10px;
 border:0;border-radius:50%;background:#8b604d;color:#191513}
.accept:hover{background:#a2725a}
.editor-text{position:absolute;z-index:2;width:min(260px,calc(100% - 20px));min-width:120px;max-width:calc(100% - 20px);
 border:1px solid #ddd8;border-radius:5px;background:#242524f2;padding:5px 7px;color:white;font-size:19px;outline:2px solid #ffffff22;outline-offset:1px}
.toast{position:absolute;z-index:3;left:50%;bottom:55px;transform:translateX(-50%);
 padding:9px 12px;border-radius:10px;background:#363e38;color:#e6eee9;
 font-size:12px;white-space:nowrap;max-width:95%;box-shadow:0 5px 20px #0009}
.closed{display:grid;gap:12px;justify-items:center;color:#aaa;font-size:13px}
.closed button{padding:12px 20px;border-radius:12px;border:1px solid #ffffff2a;background:#292c2a;color:white}
@media(max-width:540px){
 .window{--w:min(calc(100vw - 56px),calc((100dvh - 177px)*4/3));
 width:calc(var(--w) + 42px);padding:60px 0 58px;border-radius:16px}
 .board{margin-left:20px}.slider{left:-2px}.left{left:5px}.right{right:5px}
 .tool{width:35px;height:35px;padding:9px}.palette{left:43%;gap:6px;max-width:calc(100% - 54px)}
 .swatch{width:21px;height:21px;flex-basis:21px}.accept{right:6px;bottom:10px;width:33px;height:33px}
}
</style>
</head>
<body>
<div class="window" id="editor" role="dialog" aria-label="Janela de desenho do popAI, proporção 4:3">
  <div class="left"><button class="icon" id="close" aria-label="Fechar editor" title="Fechar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button></div>
  <nav class="toolbar" aria-label="Ferramentas">
    <button class="tool" data-tool="move" aria-label="Selecionar e mover item" title="Selecionar e mover item" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><path d="m4 3 3.5 16 3.4-5.4 6 .2L4 3Z"/><path d="m11 14 4 7"/></svg>
    </button>
    <button class="tool" data-tool="pen" aria-label="Pincel" title="Pincel" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 19c3 3 5-6 7-9s4-7 5-6-3 8-5 11 2 3 4 0 3-5 4-5-2 9 1 9"/></svg>
    </button>
    <button class="tool" data-tool="text" aria-label="Texto" title="Adicionar texto" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 6h16m-8 0v13m-4 0h8"/></svg>
    </button>
    <button class="tool" data-tool="shape" aria-label="Formas" title="Formas" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><rect x="3" y="4" width="12" height="12" rx="2"/><rect x="9" y="9" width="12" height="12" rx="2"/></svg>
    </button>
    <button class="tool" data-tool="eraser" aria-label="Borracha" title="Borracha" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="m4 14 10-10 7 7-10 10H7l-3-3a3 3 0 0 1 0-4Z"/><path d="m10 8 8 8M11 21h11"/></svg>
    </button>
    <div class="shape-menu" id="shapes" hidden>
      <button data-shape="rect" aria-label="Retângulo" title="Retângulo" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      </button>
      <button data-shape="ellipse" aria-label="Elipse" title="Elipse" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
      </button>
    </div>
  </nav>
  <div class="right">
    <button class="icon" id="undo" aria-label="Desfazer" title="Desfazer (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 8-5 5 5 5M4 13h9a6 6 0 0 1 6 6"/></svg>
    </button>
    <button class="icon" id="redo" aria-label="Refazer" title="Refazer (Ctrl+Y)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 8 5 5-5 5m5-5h-9a6 6 0 0 0-6 6"/></svg>
    </button>
  </div>
  <div class="slider" title="Espessura do pincel">
    <input type="range" id="size" min="1" max="32" value="8" aria-label="Espessura do pincel">
  </div>
  <div class="board" id="board">
    <canvas id="canvas" width="960" height="720" aria-label="Tela de desenho 4:3"></canvas>
    <div id="selection-box" class="selection-box" role="group" aria-label="Redimensionar objeto selecionado" hidden>
      <button type="button" class="resize-handle" data-corner="nw" aria-label="Redimensionar pelo canto superior esquerdo"></button>
      <button type="button" class="resize-handle" data-corner="ne" aria-label="Redimensionar pelo canto superior direito"></button>
      <button type="button" class="resize-handle" data-corner="sw" aria-label="Redimensionar pelo canto inferior esquerdo"></button>
      <button type="button" class="resize-handle" data-corner="se" aria-label="Redimensionar pelo canto inferior direito"></button>
    </div>
    <input id="text-entry" class="editor-text" type="text" maxlength="140" placeholder="Digite e pressione Enter" aria-label="Texto" hidden>
  </div>
  <div class="palette" role="group" aria-label="Cores do pincel">
    <button class="swatch wheel" id="wheel" title="Escolher outra cor" aria-label="Mais cores" aria-pressed="false"></button>
    <input id="custom" type="color" value="#ffffff" tabindex="-1">
    <button class="swatch" data-color="#ffffff" style="--c:#ffffff" aria-label="Branco" aria-pressed="true"></button>
    <button class="swatch" data-color="#777f8e" style="--c:#777f8e" aria-label="Cinza" aria-pressed="false"></button>
    <button class="swatch" data-color="#9b4d20" style="--c:#9b4d20" aria-label="Marrom" aria-pressed="false"></button>
    <button class="swatch" data-color="#e63838" style="--c:#e63838" aria-label="Vermelho" aria-pressed="false"></button>
    <button class="swatch" data-color="#f47b25" style="--c:#f47b25" aria-label="Laranja" aria-pressed="false"></button>
    <button class="swatch" data-color="#ffb629" style="--c:#ffb629" aria-label="Amarelo" aria-pressed="false"></button>
    <button class="swatch" data-color="#28a854" style="--c:#28a854" aria-label="Verde" aria-pressed="false"></button>
    <button class="swatch" data-color="#1b9a91" style="--c:#1b9a91" aria-label="Verde azulado" aria-pressed="false"></button>
    <button class="swatch" data-color="#08b7cf" style="--c:#08b7cf" aria-label="Ciano" aria-pressed="false"></button>
    <button class="swatch" data-color="#3479e7" style="--c:#3479e7" aria-label="Azul" aria-pressed="false"></button>
    <button class="swatch" data-color="#6656db" style="--c:#6656db" aria-label="Índigo" aria-pressed="false"></button>
    <button class="swatch" data-color="#9c37ce" style="--c:#9c37ce" aria-label="Roxo" aria-pressed="false"></button>
    <button class="swatch" data-color="#da3b89" style="--c:#da3b89" aria-label="Rosa" aria-pressed="false"></button>
  </div>
  <button class="accept" id="confirm" title="Baixar esboço PNG 4:3" aria-label="Confirmar esboço">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 10-10"/></svg>
  </button>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<div class="closed" id="closed" hidden><span>Prévia independente em 4:3</span><button id="reopen">Abrir editor</button></div>
<script>
(()=>{
'use strict';
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),W=960,H=720;
const $=selector=>document.querySelector(selector);
const buttons=[...document.querySelectorAll('.tool')],swatches=[...document.querySelectorAll('[data-color]')];
let mode='pen',shape='rect',ink='#ffffff',items=[],states=[[]],step=0,current=null,gesture=null,selected=-1,entryPos=null,toastTimer=null;
const copy=value=>JSON.parse(JSON.stringify(value)),brush=()=>Number($('#size').value)*2;
const refreshHistory=()=>{$('#undo').disabled=step===0;$('#redo').disabled=step===states.length-1;};
function tool(next){
 mode=next;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===mode)));
 if(mode!=='move') selected=-1;
 updateSelection();
 canvas.style.cursor=mode==='move'?'default':mode==='text'?'text':mode==='eraser'?'cell':'crosshair';
 if(mode!=='shape')$('#shapes').hidden=true;
}
buttons.forEach(b=>b.onclick=()=>{
 if(b.dataset.tool==='shape'){const open=mode==='shape'&&!$('#shapes').hidden;tool('shape');$('#shapes').hidden=open;}
 else {
  tool(b.dataset.tool);
  if(mode==='text' && $('#text-entry').hidden) addText({x:W/2,y:H/2});
 }
});
document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{
 shape=b.dataset.shape;
 document.querySelectorAll('[data-shape]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)));
 tool('shape');$('#shapes').hidden=true;
});
swatches.forEach(b=>b.onclick=()=>{
 ink=b.dataset.color;swatches.forEach(o=>o.setAttribute('aria-pressed',String(o===b)));
 $('#wheel').setAttribute('aria-pressed','false');
});
$('#wheel').onclick=()=>$('#custom').click();
$('#custom').oninput=e=>{
 ink=e.target.value;swatches.forEach(b=>b.setAttribute('aria-pressed','false'));
 $('#wheel').setAttribute('aria-pressed','true');
};
function pos(e){const r=canvas.getBoundingClientRect();return {
 x:Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width)),
 y:Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))
};}
function draw(item){
 ctx.lineWidth=item.w;ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=item.color;ctx.fillStyle=item.color;
 if(item.kind==='pen'||item.kind==='eraser'){
  ctx.globalCompositeOperation=item.kind==='eraser'?'destination-out':'source-over';
  ctx.beginPath();const pts=item.points;
  if(pts.length===1){ctx.arc(pts[0].x,pts[0].y,item.w/2,0,Math.PI*2);ctx.fill();}
  else{ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
  ctx.globalCompositeOperation='source-over';return;
 }
 if(item.kind==='text'){ctx.font='500 '+item.w+'px system-ui';ctx.textBaseline='top';ctx.fillText(item.value,item.x,item.y);return;}
 ctx.beginPath();const dx=item.b.x-item.a.x,dy=item.b.y-item.a.y;
 if(item.kind==='rect')ctx.rect(item.a.x,item.a.y,dx,dy);
 else ctx.ellipse((item.a.x+item.b.x)/2,(item.a.y+item.b.y)/2,Math.max(.01,Math.abs(dx)/2),Math.max(.01,Math.abs(dy)/2),0,0,Math.PI*2);
 ctx.stroke();
}
function shifted(item,dx,dy){
 const x=copy(item),shift=p=>{p.x+=dx;p.y+=dy;};
 if(x.points)x.points.forEach(shift);
 if(x.a){shift(x.a);shift(x.b);}
 if(x.kind==='text'){x.x+=dx;x.y+=dy;}return x;
}
function itemBounds(item){
 if(item.kind==='text'){
  ctx.font='500 '+item.w+'px system-ui';
  const width=ctx.measureText(item.value).width;
  return {x:item.x,y:item.y,w:Math.max(1,width),h:item.w*1.2};
 }
 const pad=item.w/2;
 if(item.points){
  const xs=item.points.map(p=>p.x),ys=item.points.map(p=>p.y);
  return {x:Math.min(...xs)-pad,y:Math.min(...ys)-pad,
   w:Math.max(...xs)-Math.min(...xs)+2*pad,h:Math.max(...ys)-Math.min(...ys)+2*pad};
 }
 return {x:Math.min(item.a.x,item.b.x)-pad,y:Math.min(item.a.y,item.b.y)-pad,
  w:Math.abs(item.a.x-item.b.x)+2*pad,h:Math.abs(item.a.y-item.b.y)+2*pad};
}
function distanceToSegment(p,a,b){
 const dx=b.x-a.x,dy=b.y-a.y,den=dx*dx+dy*dy;
 const t=den?Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/den)):0;
 return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);
}
function hitItem(item,p,inside=false){
 if(item.kind==='eraser')return false; // A borracha é uma operação, não um objeto selecionável.
 const b=itemBounds(item),slack=12;
 if(p.x<b.x-slack||p.x>b.x+b.w+slack||p.y<b.y-slack||p.y>b.y+b.h+slack)return false;
 if(item.kind==='text')return true;
 if(item.points){
  if(item.points.length===1)return Math.hypot(p.x-item.points[0].x,p.y-item.points[0].y)<=item.w/2+slack;
  return item.points.slice(1).some((b,i)=>distanceToSegment(p,item.points[i],b)<=item.w/2+slack);
 }
 const x1=Math.min(item.a.x,item.b.x),x2=Math.max(item.a.x,item.b.x);
 const y1=Math.min(item.a.y,item.b.y),y2=Math.max(item.a.y,item.b.y);
 const margin=item.w/2+slack;
 if(item.kind==='rect'){
  if(inside)return p.x>=x1&&p.x<=x2&&p.y>=y1&&p.y<=y2;
  return (Math.abs(p.x-x1)<=margin||Math.abs(p.x-x2)<=margin)&&p.y>=y1-margin&&p.y<=y2+margin
   ||(Math.abs(p.y-y1)<=margin||Math.abs(p.y-y2)<=margin)&&p.x>=x1-margin&&p.x<=x2+margin;
 }
 const rx=Math.max(.01,(x2-x1)/2),ry=Math.max(.01,(y2-y1)/2);
 const norm=Math.hypot((p.x-(x1+x2)/2)/rx,(p.y-(y1+y2)/2)/ry);
 return inside?norm<=1:Math.abs(norm-1)*Math.min(rx,ry)<=margin;
}
function hitTest(p){
 for(const inside of [false,true])
  for(let i=items.length-1;i>=0;i--)
   if(hitItem(items[i],p,inside))return i;
 return -1;
}
function scaledItem(item,bounds,corner,dx,dy){
 // The opposite corner remains anchored while the dragged corner changes size.
 const left=corner.includes('w'),top=corner.includes('n');
 const anchorX=left?bounds.x+bounds.w:bounds.x,anchorY=top?bounds.y+bounds.h:bounds.y;
 const sx=Math.min(8,Math.max(0.12,(bounds.w+(left?-dx:dx))/Math.max(1,bounds.w)));
 const sy=Math.min(8,Math.max(0.12,(bounds.h+(top?-dy:dy))/Math.max(1,bounds.h)));
 const result=copy(item);
 if(item.kind==='text'){
  // Text keeps its font proportions; diagonal dragging changes its font size.
  const uniform=Math.min(8,Math.max(0.2,Math.sqrt(sx*sy)));
  result.x=anchorX+(item.x-anchorX)*uniform;
  result.y=anchorY+(item.y-anchorY)*uniform;
  result.w=item.w*uniform;
 }else{
  const transform=p=>{p.x=anchorX+(p.x-anchorX)*sx;p.y=anchorY+(p.y-anchorY)*sy;};
  if(result.points)result.points.forEach(transform);
  if(result.a){transform(result.a);transform(result.b);}
  result.w=item.w*Math.sqrt(sx*sy);
 }
 return result;
}
function activeItem(index){
 if(!gesture||gesture.index!==index)return items[index];
 if(gesture.kind==='resize')return scaledItem(gesture.original,gesture.bounds,gesture.corner,gesture.dx,gesture.dy);
 if(gesture.kind==='move')return shifted(items[index],gesture.dx,gesture.dy);
 return items[index];
}
function updateSelection(){
 const frame=$('#selection-box');
 if(mode!=='move'||selected<0||!items[selected]||items[selected].kind==='eraser'){
  frame.hidden=true;delete frame.dataset.index;return;
 }
 const b=itemBounds(activeItem(selected)),r=canvas.getBoundingClientRect(),board=$('#board').getBoundingClientRect();
 frame.style.left=(r.left-board.left+b.x*r.width/W)+'px';
 frame.style.top=(r.top-board.top+b.y*r.height/H)+'px';
 frame.style.width=Math.max(2,b.w*r.width/W)+'px';
 frame.style.height=Math.max(2,b.h*r.height/H)+'px';
 frame.hidden=false;frame.dataset.index=String(selected);
}
function repaint(){
 ctx.clearRect(0,0,W,H);
 items.forEach((_,i)=>draw(activeItem(i)));
 if(current)draw(current);
 updateSelection();
}
document.querySelectorAll('.resize-handle').forEach(handle=>{
 handle.addEventListener('pointerdown',e=>{
  if(mode!=='move'||selected<0||gesture||e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  const p=pos(e);
  gesture={kind:'resize',id:e.pointerId,index:selected,corner:handle.dataset.corner,
   original:copy(items[selected]),bounds:itemBounds(items[selected]),start:p,dx:0,dy:0};
  handle.setPointerCapture(e.pointerId);
 });
 handle.addEventListener('pointermove',e=>{
  if(!gesture||gesture.kind!=='resize'||gesture.id!==e.pointerId)return;
  const p=pos(e);
  gesture.dx=p.x-gesture.start.x;
  gesture.dy=p.y-gesture.start.y;
  repaint();
 });
 const done=(e,cancelled=false)=>{
  if(!gesture||gesture.kind!=='resize'||gesture.id!==e.pointerId)return;
  const g=gesture;
  gesture=null;
  if(!cancelled&&(Math.abs(g.dx)+Math.abs(g.dy)>1)){
   items[g.index]=scaledItem(g.original,g.bounds,g.corner,g.dx,g.dy);
   save();
  }else repaint();
 };
 handle.addEventListener('pointerup',e=>done(e));
 handle.addEventListener('pointercancel',e=>done(e,true));
});
function save(){states.splice(step+1);states.push(copy(items));step=states.length-1;refreshHistory();repaint();}
function undo(){if(step>0){step--;items=copy(states[step]);selected=-1;refreshHistory();repaint();}}
function redo(){if(step<states.length-1){step++;items=copy(states[step]);selected=-1;refreshHistory();repaint();}}
$('#undo').onclick=undo;$('#redo').onclick=redo;
function addText(p){
 const entry=$('#text-entry');
 if(!entry.hidden) finishText();
 entryPos=p;
 entry.hidden=false;entry.value='';entry.style.color=ink;
 entry.style.fontSize=Math.max(14,Math.round(Math.max(25,brush()*2.5)*canvas.getBoundingClientRect().width/W))+'px';
 const rect=entry.getBoundingClientRect();
 const board=canvas.getBoundingClientRect();
 entry.style.left=Math.max(8,Math.min(p.x/W*board.width,board.width-rect.width-8))+'px';
 entry.style.top=Math.max(8,Math.min(p.y/H*board.height,board.height-rect.height-8))+'px';
 entry.focus();
}
function finishText(){
 const field=$('#text-entry');if(field.hidden)return;
 const value=field.value.trim();field.hidden=true;
 if(value){items.push({kind:'text',x:entryPos.x,y:entryPos.y,color:ink,w:Math.max(25,brush()*2.5),value});save();}
}
$('#text-entry').onkeydown=e=>{
 if(e.key==='Enter'){e.preventDefault();finishText();}
 if(e.key==='Escape'){e.preventDefault();$('#text-entry').hidden=true;}
};
$('#text-entry').onblur=finishText;
canvas.onpointerdown=e=>{
 if(e.button!==0||gesture)return;
 $('#shapes').hidden=true;const p=pos(e);
 if(mode==='text')return;
 if(mode==='move'){
  selected=hitTest(p);
  updateSelection();
  if(selected<0){canvas.style.cursor='default';return;}
 }
 gesture={kind:mode==='move'?'move':'draw',id:e.pointerId,start:p,index:mode==='move'?selected:-1,dx:0,dy:0};
 if(mode==='pen'||mode==='eraser')current={kind:mode,color:ink,w:brush(),points:[p]};
 else if(mode==='shape')current={kind:shape,color:ink,w:brush(),a:p,b:p};
 canvas.setPointerCapture(e.pointerId);
 if(mode==='move')canvas.style.cursor='grabbing';
 repaint();
};
canvas.onpointermove=e=>{
 if(!gesture){
  if(mode==='move')canvas.style.cursor=hitTest(pos(e))<0?'default':'grab';
  return;
 }
 if(e.pointerId!==gesture.id)return;
 const p=pos(e);
 if(mode==='move'){gesture.dx=p.x-gesture.start.x;gesture.dy=p.y-gesture.start.y;}
 else if(current){if(current.points)current.points.push(p);else current.b=p;}
 repaint();
};
function end(e,cancelled){
 if(!gesture||e.pointerId!==gesture.id)return;
 if(!cancelled){
  if(mode==='move'){
   if(gesture.index>=0&&Math.abs(gesture.dx)+Math.abs(gesture.dy)>1){
    items[gesture.index]=shifted(items[gesture.index],gesture.dx,gesture.dy);
    gesture=null;save();
   }
  }else if(current){items.push(current);gesture=null;save();}
 }
 gesture=null;current=null;
 canvas.style.cursor=mode==='move'?'grab':canvas.style.cursor;
 repaint();
}
canvas.onclick=e=>{if(mode==='text')addText(pos(e));};
canvas.onpointerup=e=>end(e,false);canvas.onpointercancel=e=>end(e,true);
canvas.oncontextmenu=e=>e.preventDefault();
document.addEventListener('keydown',e=>{
 if(e.target===$('#text-entry'))return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();}
 if(e.key==='Escape'){$('#shapes').hidden=true;selected=-1;updateSelection();}
});
$('#close').onclick=()=>{$('#editor').hidden=true;$('#closed').hidden=false;};
$('#reopen').onclick=()=>{$('#editor').hidden=false;$('#closed').hidden=true;repaint();};
function notice(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4300);}
$('#confirm').onclick=()=>{
 const image=document.createElement('canvas');image.width=W;image.height=H;
 const c=image.getContext('2d');c.fillStyle='#202121';c.fillRect(0,0,W,H);c.drawImage(canvas,0,0);
 image.toBlob(blob=>{
  if(!blob){notice('Falha ao exportar o desenho');return;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='popai-sketch-4x3.png';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  notice('PNG 4:3 exportado · Ainda não conectado ao popAI.');
 },'image/png');
};
window.addEventListener('resize',updateSelection);
refreshHistory();repaint();
})();
</script>
</body>
</html>
